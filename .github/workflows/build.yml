name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Get upstream b8025c7 source (curl tarball)
        run: |
          rm -rf ./* 2>/dev/null
          curl -sL https://github.com/lsmsmx/MikuMikuSwitchPlugin/archive/b8025c7.tar.gz -o /tmp/up.tar.gz
          tar -xzf /tmp/up.tar.gz --strip-components=1
          ls | head -20

      - name: Build (log to /tmp)
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITA64=/opt/devkitpro/devkitA64
          export PATH=$DEVKITA64/bin:$DEVKITPRO/tools/bin:/usr/bin:/bin
          make -j8 > /tmp/build.log 2>&1
          tail -5 /tmp/build.log
          mkdir -p deploy
          cp deploy/subsdk9 /tmp/subsdk9 2>/dev/null || true

      - name: Push build log to ci-logs branch (on failure)
        if: failure()
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git checkout -b ci-logs 2>/dev/null || git checkout ci-logs
          cp /tmp/build.log ./ci-build-log.txt
          git add ci-build-log.txt
          git commit -m "ci: build log $(date +%s)"
          git push origin ci-logs

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-repro
          path: deploy/
          if-no-files-found: error