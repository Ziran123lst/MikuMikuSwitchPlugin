name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    timeout-minutes: 60
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Get upstream b8025c7 source (curl tarball)
        run: |
          rm -rf ./* 2>/dev/null
          curl -sL https://github.com/lsmsmx/MikuMikuSwitchPlugin/archive/b8025c7.tar.gz -o /tmp/up.tar.gz
          ls -la /tmp/up.tar.gz
          tar -xzf /tmp/up.tar.gz --strip-components=1
          ls | head -20

      - name: Build (log to /tmp)
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITA64=/opt/devkitpro/devkitA64
          export PATH=$DEVKITA64/bin:$DEVKITPRO/tools/bin:/usr/bin:/bin
          make -j8 > /tmp/build.log 2>&1
          tail -5 /tmp/build.log
          mkdir -p deploy
          cp deploy/subsdk9 /tmp/subsdk9 2>/dev/null || true

      - name: Post build log to issue (on failure)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import urllib.request, json, os, time
          try:
              body = open('/tmp/build.log', encoding='utf-8', errors='replace').read()
          except Exception:
              body = 'no build.log; earlier step failed'
          body = body[-6000:]
          payload = json.dumps({
              "title": "CI build log #" + str(int(time.time())),
              "body": "```\n" + body + "\n```"
          }).encode()
          req = urllib.request.Request(
              'https://api.github.com/repos/Ziran123lst/MikuMikuSwitchPlugin/issues',
              data=payload,
              headers={"Authorization": "token " + os.environ['GH_TOKEN'],
                       "Accept": "application/vnd.github+json",
                       "Content-Type": "application/json"})
          print(urllib.request.urlopen(req, timeout=30).read().decode()[:200])
          PY

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-repro
          path: deploy/
          if-no-files-found: error