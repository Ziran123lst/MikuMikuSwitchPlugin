name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    timeout-minutes: 60
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Get upstream b8025c7 source (curl tarball)
        run: |
          rm -rf ./* 2>/dev/null
          curl -sL https://github.com/lsmsmx/MikuMikuSwitchPlugin/archive/b8025c7.tar.gz -o /tmp/up.tar.gz
          ls -la /tmp/up.tar.gz
          tar -xzf /tmp/up.tar.gz --strip-components=1
          ls | head -20

      - name: Build (log to /tmp)
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITA64=/opt/devkitpro/devkitA64
          export PATH=$DEVKITA64/bin:$DEVKITPRO/tools/bin:/usr/bin:/bin
          make -j8 > /tmp/build.log 2>&1
          tail -5 /tmp/build.log
          mkdir -p deploy
          cp deploy/subsdk9 /tmp/subsdk9 2>/dev/null || true

      - name: Publish build log to release ci-log (on failure)
        if: failure()
        run: |
          touch /tmp/build.log 2>/dev/null || true
          ls -la /tmp/build.log

      - name: Release build log (on failure)
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-log
          name: CI build log
          body: "CI failure log"
          files: /tmp/build.log
          fail_on_unmatched_files: false

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-repro
          path: deploy/
          if-no-files-found: error