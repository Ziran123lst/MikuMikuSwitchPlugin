name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:20250527
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Probe toolchain version
        run: |
          {
            echo "=== gcc version ==="
            /opt/devkitpro/devkitA64/bin/aarch64-none-elf-gcc --version | head -2
            echo "=== newlib ==="
            grep -E "NEWLIB|__NEWLIB" /opt/devkitpro/devkitA64/aarch64-none-elf/include/newlib.h | head -3
            echo "=== version files ==="
            cat /opt/devkitpro/devkitA64/version 2>/dev/null | head -3
            ls /opt/devkitpro/devkitA64/*.txt /opt/devkitpro/devkitA64/README* 2>/dev/null | head -3
            echo "=== package ==="
            cat /opt/devkitpro/switch-dev/README* 2>/dev/null | head -5
            cat /opt/devkitpro/DEVKITPRO_VERSION* 2>/dev/null | head -2
            ls /opt/devkitpro/ | head -10
          } > /tmp/probe.txt
          cat /tmp/probe.txt

      - name: Release probe result
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-probe
          name: CI probe result
          body: "probe"
          files: /tmp/probe.txt
          fail_on_unmatched_files: false