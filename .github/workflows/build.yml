          sed -i 's/^CXX_FLAGS := .*/CXX_FLAGS := -Wno-error -ffile-prefix-map=\/home\/lsmsmx\/m\/source\/rtld=\/home\/lsmsmx\/exlaunch\/source\/rtld/' config.mk
      - name: Apply taa-vC-c16.patch
        run: |
          cp "$GITHUB_WORKSPACE/patches/taa-vC-c16.patch" /tmp/p.patch
          cd /home/lsmsmx/m
          patch -p1 < /tmp/p.patch
          grep -n "JITTER_BODY" source/program/FTRestoration.cpp | head -1
      - name: Build
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITA64=/opt/devkitpro/devkitA64
          export PATH=$DEVKITA64/bin:$DEVKITPRO/tools/bin:/usr/bin:/bin
          cd /home/lsmsmx/m
          make -j8 > /tmp/build.log 2>&1
          tail -3 /tmp/build.log
      - name: Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: taa-vC-c16-build
          name: "vC-c16: jitter + unfreeze phase (w23 period kept)"
          body: "b8025c7 + c16 jitter + NOP 0x4AC3FC cbz"
          files: |
            /home/lsmsmx/m/deploy/subsdk9
            /tmp/build.log
          fail_on_unmatched_files: false

  vC-rgss16:
