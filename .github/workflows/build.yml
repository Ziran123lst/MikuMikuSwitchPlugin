name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build in devkitpro Docker image
        run: |
          set -e
          sudo docker run --rm -v "$PWD:/build" -w /build \
            -e DEVKITPRO=/opt/devkitpro \
            -e DEVKITA64=/opt/devkitpro/devkitA64 \
            devkitpro/devkita64:latest \
            bash -c "export PATH=/opt/devkitpro/devkitA64/bin:/opt/devkitpro/tools/bin:/usr/bin:/bin && make -j8"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: miku-mega39-plugin
          path: deploy/
          if-no-files-found: error
