name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Reset to upstream b8025c7 (repro test)
        run: |
          git remote add upstream https://github.com/lsmsmx/MikuMikuSwitchPlugin.git
          git fetch upstream b8025c7
          git reset --hard upstream/b8025c7
          git log --oneline -1

      - name: Build
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITA64=/opt/devkitpro/devkitA64
          export PATH=$DEVKITA64/bin:$DEVKITPRO/tools/bin:/usr/bin:/bin
          make -j8

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: upstream-repro
          path: deploy/
          if-no-files-found: error