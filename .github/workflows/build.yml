name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:20250527
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup /home/lsmsmx paths and fetch upstream b8025c7
        run: |
          mkdir -p /home/lsmsmx/m
          curl -sL https://github.com/lsmsmx/MikuMikuSwitchPlugin/archive/b8025c7.tar.gz -o /tmp/up.tar.gz
          tar -xzf /tmp/up.tar.gz --strip-components=1 -C /home/lsmsmx/m
          ls /home/lsmsmx/m | head -5

      - name: Patch config.mk (-Wno-error + file-prefix-map)
        run: |
          cd /home/lsmsmx/m
          sed -i 's/^C_FLAGS := .*/C_FLAGS := -Wno-error -ffile-prefix-map=\/home\/lsmsmx\/m\/source\/rtld=\/home\/lsmsmx\/exlaunch\/source\/rtld/' config.mk
          sed -i 's/^CXX_FLAGS := .*/CXX_FLAGS := -Wno-error -ffile-prefix-map=\/home\/lsmsmx\/m\/source\/rtld=\/home\/lsmsmx\/exlaunch\/source\/rtld/' config.mk
          grep -E "C_FLAGS|CXX_FLAGS" config.mk

      - name: Build
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITA64=/opt/devkitpro/devkitA64
          export PATH=$DEVKITA64/bin:$DEVKITPRO/tools/bin:/usr/bin:/bin
          cd /home/lsmsmx/m
          make -j8 > /tmp/build.log 2>&1
          tail -5 /tmp/build.log
          ls -la deploy/ 2>/dev/null || ls -la *.elf

      - name: Release subsdk9
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: repro2-build
          name: repro2 (20250527 + /home/lsmsmx paths)
          body: "repro2 build"
          files: |
            /home/lsmsmx/m/deploy/subsdk9
            /home/lsmsmx/m/m.elf
          fail_on_unmatched_files: false

      - name: Release build log
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-log
          name: CI build log
          body: "log"
          files: /tmp/build.log
          fail_on_unmatched_files: false