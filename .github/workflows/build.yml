name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Pull devkitpro image (with retry)
        run: |
          set -e
          for i in 1 2 3 4 5; do
            if sudo docker pull devkitpro/devkita64:latest 2>&1 | tail -3; then
              echo "pull OK on attempt $i"
              break
            fi
            echo "pull attempt $i failed, retrying in 10s..."
            sleep 10
          done
          sudo docker image inspect devkitpro/devkita64:latest >/dev/null

      - name: Build in devkitpro container
        run: |
          set -e
          sudo docker run --rm -v "$PWD:/build" -w /build \
            -e DEVKITPRO=/opt/devkitpro \
            -e DEVKITA64=/opt/devkitpro/devkitA64 \
            devkitpro/devkita64:latest \
            bash -c "export PATH=/opt/devkitpro/devkitA64/bin:/opt/devkitpro/tools/bin:/usr/bin:/bin && make -j8"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: miku-mega39-plugin
          path: deploy/
          if-no-files-found: error
