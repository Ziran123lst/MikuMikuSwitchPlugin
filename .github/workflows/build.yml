name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  taa-user3:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:20241023
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Probe + fetch b8025c7
        run: |
          mkdir -p /home/lsmsmx/m
          curl -sL https://github.com/lsmsmx/MikuMikuSwitchPlugin/archive/b8025c7.tar.gz -o /tmp/up.tar.gz
          tar -xzf /tmp/up.tar.gz --strip-components=1 -C /home/lsmsmx/m

      - name: Patch config.mk
        run: |
          cd /home/lsmsmx/m
          sed -i 's/^C_FLAGS := .*/C_FLAGS := -Wno-error -ffile-prefix-map=\/home\/lsmsmx\/m\/source\/rtld=\/home\/lsmsmx\/exlaunch\/source\/rtld/' config.mk
          sed -i 's/^CXX_FLAGS := .*/CXX_FLAGS := -Wno-error -ffile-prefix-map=\/home\/lsmsmx\/m\/source\/rtld=\/home\/lsmsmx\/exlaunch\/source\/rtld/' config.mk

      - name: Apply taa-user3 patch
        run: |
          cp "$GITHUB_WORKSPACE/patches/taa-user3.patch" /tmp/taa-user3.patch
          cd /home/lsmsmx/m
          patch -p1 < /tmp/taa-user3.patch
          grep -n "0x00481C40" source/program/FTRestoration.cpp | head -2

      - name: Build
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITA64=/opt/devkitpro/devkitA64
          export PATH=$DEVKITA64/bin:$DEVKITPRO/tools/bin:/usr/bin:/bin
          cd /home/lsmsmx/m
          make -j8 > /tmp/build.log 2>&1
          tail -3 /tmp/build.log

      - name: Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: taa-user3-build
          name: taa-user3 (user 3-patch, vaddr corrected)
          body: "b8025c7 + NOP/w26/jitter only"
          files: |
            /home/lsmsmx/m/deploy/subsdk9
            /tmp/build.log
          fail_on_unmatched_files: false

  taa-8samp:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:20241023
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Probe + fetch b8025c7
        run: |
          mkdir -p /home/lsmsmx/m
          curl -sL https://github.com/lsmsmx/MikuMikuSwitchPlugin/archive/b8025c7.tar.gz -o /tmp/up.tar.gz
          tar -xzf /tmp/up.tar.gz --strip-components=1 -C /home/lsmsmx/m

      - name: Patch config.mk
        run: |
          cd /home/lsmsmx/m
          sed -i 's/^C_FLAGS := .*/C_FLAGS := -Wno-error -ffile-prefix-map=\/home\/lsmsmx\/m\/source\/rtld=\/home\/lsmsmx\/exlaunch\/source\/rtld/' config.mk
          sed -i 's/^CXX_FLAGS := .*/CXX_FLAGS := -Wno-error -ffile-prefix-map=\/home\/lsmsmx\/m\/source\/rtld=\/home\/lsmsmx\/exlaunch\/source\/rtld/' config.mk

      - name: Apply taa-8samp patch
        run: |
          cp "$GITHUB_WORKSPACE/patches/taa-8samp.patch" /tmp/taa-8samp.patch
          cd /home/lsmsmx/m
          patch -p1 < /tmp/taa-8samp.patch
          grep -n "sTaa8SampleBody" source/program/FTRestoration.cpp | head -2

      - name: Build
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITA64=/opt/devkitpro/devkitA64
          export PATH=$DEVKITA64/bin:$DEVKITPRO/tools/bin:/usr/bin:/bin
          cd /home/lsmsmx/m
          make -j8 > /tmp/build.log 2>&1
          tail -3 /tmp/build.log

      - name: Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: taa-8samp-build
          name: taa-8samp (8-sample tier, low overhead)
          body: "b8025c7 + NOP/getter(8samp)/enable/w26/jitter"
          files: |
            /home/lsmsmx/m/deploy/subsdk9
            /tmp/build.log
          fail_on_unmatched_files: false
