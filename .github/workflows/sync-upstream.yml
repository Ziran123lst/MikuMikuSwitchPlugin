name: sync-upstream

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge upstream into main
        run: |
          set -e
          git remote add upstream https://github.com/lsmsmx/MikuMikuSwitchPlugin.git 2>/dev/null || git remote set-url upstream https://github.com/lsmsmx/MikuMikuSwitchPlugin.git
          git fetch upstream main
          if git merge --no-edit upstream/main -X ours --allow-unrelated-histories; then
            echo "upstream merged cleanly"
          else
            echo "conflicts auto-resolved with -X ours (local patches win)"
            git add -A
            git commit --no-edit -m "Merge upstream (auto-resolved, local patches win)"
          fi
          git push origin main
          echo "SYNC_OK"
